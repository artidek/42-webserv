host{

	host_configs
	{
		addr: 0.0.0.0;
		ports: [8080, 8090]
		max_request_body: 1048576;
		host_timeout: 10;
	}

	cgi_config {
		cgi_allowed: on;
		root: etc/cgi_bin;
		default_cgi: none;
		cgi_extensions: [php, py, cgi]
	}

	route / {
		new_root: tests/static_site/;
		page: index.html;
		success_response: 200;
	}

	route /about {
		new_root: tests/static_site/;
		page: about.html;
		success_response: 200;
	}

	route /styles {
		new_root: tests/static_site/assets/css;
		page: style.css;
		success_response: 200;
	}

	route /contact {
		new_root: tests/static_site/;
		page: contact.html;
		success_response: 200;
	}

	route /images {
		new_root: tests/static_site/assets/img;
		page: none;
		success_response: 200;
	}

	route /upload/form {
		new_root: tests/static_site/;
		page: upload_delete.html;
		success_response: 200;
	}

	route /list {
		new_root: tests/uploads/;
		page: none;
		success_response: 200;
	}

	route /upload {
		new_root: tests/uploads/;
		page: none;
		success_response: 200;
	}

	route /submit {
		new_root: etc/cgi_bin/;
		page: none;
		success_response: 200;
	}

	location etc/cgi_bin/
	{
		directory_listing: on;
		upload_enabled: on;
		methods: [GET,POST, DELETE]
		list_ext: none;
		upload_ext: none;
	}

	location tests/uploads/
	{
		directory_listing: on;
		upload_enabled: on;
		methods: [GET,POST, DELETE]
		list_ext: [pdf, txt];
		upload_ext: [pdf, txt];
	}

	location tests/static_site/
	{
		directory_listing: off;
		upload_enabled: off;
		methods: [GET,HEAD]
		list_ext: none;
		upload_ext: none;
	}

	location tests/static_site/assets/css
	{
		directory_listing: off;
		upload_enabled: off;
		methods: [GET]
		list_ext: none;
		upload_ext: none;
	}

	location tests/static_site/assets/img
	{
		directory_listing: off;
		upload_enabled: off;
		methods: [GET]
		list_ext: none;
		upload_ext: none;
	}

	location etc/error {
		directory_listing: off;
		upload_enabled: off;
		methods: none;
		list_ext: none;
		upload_ext: none;
	}
}

host{

	host_configs
	{
		addr: 127.0.0.01;
		ports: [8070]
		max_request_body: 1048576;
		host_timeout: 10;
	}

	error_pages{
		400: etc/error/400.html;
		401: etc/error/401.html;
		402: etc/error/402.html;
		403: etc/error/403.html;
		404: etc/error/404.html;

		500: etc/error/500.html;
		501: etc/error/501.html;
		502: etc/error/502.html;

	}

	route / {
		new_root: etc/www/;
		page: index.html;
		success_response: 200;
	}

	location etc/www
	{
		directory_listing: off;
		upload_enabled: off;
		methods: [GET,HEAD]
		list_ext: none;
		upload_ext: none;
	}

	location etc/error {
		directory_listing: off;
		upload_enabled: off;
		methods: none;
		list_ext: none;
		upload_ext: none;
	}
}
