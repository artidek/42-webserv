server {
	host{

	host_configs
	{
		addr: 0.0.0.0;
		ports: [8080, 8090]
		max_request_body: 1048576;
		hostname: localhost;
	}

	cgi_config {
		cgi_allowed: on;
		root: etc/cgi_bin;
		default_cgi: none;
		cgi_extensions: [php, py, cgi]
	}

	route / {
		new_root: tests/static_site/;
		page: index.html;
		success_response: 200;
		methods: [GET, HEAD]
		redirect: none;
	}

	route /about {
		new_root: tests/static_site/;
		page: about.html;
		success_response: 301;
		methods: [GET]
		redirect: /some/wrong;
	}

	route /styles {
		new_root: tests/static_site/assets/css;
		page: style.css;
		success_response: 200;
		methods: [GET]
		redirect: none;
	}

	route /contact {
		new_root: tests/static_site/;
		page: contact.html;
		success_response: 200;
		methods: [GET]
		redirect: none;
	}

	route /images {
		new_root: tests/static_site/assets/img;
		page: none;
		success_response: 200;
		methods: [GET]
		redirect: none;
	}

	route /upload/form {
		new_root: tests/static_site/;
		page: upload_delete.html;
		success_response: 200;
		methods: [GET]
		redirect: none;
	}

	route /list {
		new_root: tests/uploads/;
		page: none;
		success_response: 200;
		methods: [GET]
		redirect: none;
	}

	route /upload {
		new_root: tests/uploads/;
		page: none;
		success_response: 200;
		methods: [GET,POST, DELETE]
		redirect: none;
	}

	route /submit {
		new_root: etc/cgi_bin/;
		page: none;
		success_response: 200;
		methods: [GET,POST]
		redirect: none;
	}

	location etc/cgi_bin/
	{
		directory_listing: on;
		upload_enabled: on;
		list_ext: none;
		upload_ext: none;
	}

	location tests/uploads/
	{
		directory_listing: on;
		upload_enabled: on;
		list_ext: [pdf, txt]
		upload_ext: [pdf, txt]
	}

	location tests/static_site/
	{
		directory_listing: off;
		upload_enabled: off;
		list_ext: none;
		upload_ext: none;
	}

	location tests/static_site/assets/css
	{
		directory_listing: off;
		upload_enabled: off;
		list_ext: none;
		upload_ext: none;
	}

	location tests/static_site/assets/img
	{
		directory_listing: off;
		upload_enabled: off;
		list_ext: none;
		upload_ext: none;
	}

	location etc/error {
		directory_listing: off;
		upload_enabled: off;
		list_ext: none;
		upload_ext: none;
	}
}
host
	{
	host_configs
	{
		addr: 127.0.0.1;
		ports: [8080 ]
		max_request_body: 1048576;
		hostname: default;
	}

	error_pages{
		400: etc/error/400.html;
		401: etc/error/401.html;
		402: etc/error/402.html;
		403: etc/error/403.html;
		404: etc/error/404.html;
		500: etc/error/500.html;
		501: etc/error/501.html;
		502: etc/error/502.html;
	}

	route /
	{
		new_root: etc/www/;
		page: index.html;
		success_response: 200;
		methods: [GET, HEAD]
		redirect: none;
	}

	cgi_config {
		cgi_allowed: off;
		root: etc/cgi_bin;
		default_cgi: none;
		cgi_extensions: [php, py, cgi]
	}

	location etc/www
	{
		directory_listing: off;
		upload_enabled: off;
		list_ext: none;
		upload_ext: none;
	}

	location etc/error {
		directory_listing: off;
		upload_enabled: off;
		list_ext: none;
		upload_ext: none;
	}
request_timeout: 10;
}
}

